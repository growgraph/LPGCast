[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
bench = []
dev = [
  "jsonschema>=4.23.0",
  "pre-commit>=4.5.1",
  "pytest-asyncio>=1.2.0",
  "pytest>=9.0.2",
  "ty>=0.0.14"
]

[project]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "click>=8.2.0,<9",
  "graflo>=1.17.0,<2",
  "openai>=1.109.0,<3",
  "pydantic-settings>=2.12.0",
  "pydantic>=2.12.5",
  "pyyaml>=6.0"
]
description = "Text to labeled property graph against a governed GraFlo schema"
license = "Apache-2.0"
name = "lpgcast"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
# Reserved: the dense retrieval lane and the HTTP service. Empty in 0.1.
embed = []
server = []
dev = [
    "pre-commit>=4.6.2",
    "ty>=0.0.86",
]

[project.scripts]
lpgcast = "lpgcast.cli:main"
text2lpg = "lpgcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lpgcast"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "llm: exercises a real language model (skipped unless --run-llm)"
]
testpaths = ["test"]

[tool.ruff.lint]
ignore = ["E722"]

[tool.uv.sources]
graflo = {editable = true, path = "../graflo"}
